command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

env:
  # PGHOST/PGPORT/PGDATABASE/PGUSER are injected by the attached Lakebase
  # database resource; set them here only if that resource is not configured.
  - name: LAKEBASE_ENDPOINT
    value: "projects/{project_id}/branches/{branch_id}/endpoints/{endpoint_id}"
  - name: PGSSLMODE
    value: "require"
